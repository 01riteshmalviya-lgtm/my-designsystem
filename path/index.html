<!doctype html>

<body>
<div id="stage">
  <svg id="world" width="1920" height="1440" viewBox="0 0 1920 1440">
    <defs>
      <mask id="trailMask" maskUnits="userSpaceOnUse" x="-6000" y="-6000" width="40000" height="12000">

    </defs>

      <path id="trail" fill="none" stroke="#3f151d" stroke-width="22" stroke-linecap="round" stroke-dasharray="30 34" mask="url(#trailMask)"/>

  <!-- the deck's 00 / Cover, 1024x768 scaled 1.875x -->

    <div class="cv" id="cv3" style="left:161.25px;top:720px;font-size:45px;line-height:67.5px;font-weight:600;letter-spacing:-0.45px;color:#999">12+ years of experience</div>

<script>
// ===================================================================== palette (from the reference swatches)
const COL = {
  ice: "#d7effd", gum: "#febfda", orange: "#f16a02", rasp: "#b91c44", citrus: "#dae24e",
  milk: "#f9f7ef", vanilla: "#f8f1dc", lime: "#e3fa85", cherry: "#3f151d",
};
const BRIGHTS = [COL.ice, COL.gum, COL.orange, COL.rasp, COL.citrus, COL.lime];

// ===================================================================== time
// seek(t) is a pure function of t: every attribute below is recomputed from time.
const BEAT = window.BEAT_PERIOD || 60 / 112;
const BEATS = 40, END = BEATS * BEAT, HOLD = 1.0;
const B = n => n * BEAT;
const FPS = 60;

// ===================================================================== springs + helpers
const P = {
  pop: [16, 0.55], rise: [13, 0.6], slap: [20, 0.62], drop: [15, 0.5], cam: [6.8, 1], snap: [22, 0.75],
  morph: [14, 0.8], fast: [30, 1], fade: [24, 1], soft: [10, 0.9],
};
function S(dt, [w, z]) {
  if (dt <= 0) return 0;
  if (z >= 1) { const x = w * dt; return 1 - Math.exp(-x) * (1 + x); }
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const expoOut = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
function track(v0, evs, def = P.morph) {
  const list = []; let prev = v0;
  for (const [tb, v, p] of evs) { list.push([B(tb), v - prev, p || def]); prev = v; }
  return t => { let v = v0; for (const [te, d, p] of list) v += d * S(t - te, p); return v; };
}
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const $ = id => document.getElementById(id);

// ===================================================================== drawing kit
const SH = 9; // hard sticker shadow offset
function rr(p, cx, cy, w, h, r, fill, o = {}) {
  if (o.shadow) el("rect", { x: cx - w / 2 + SH, y: cy - h / 2 + SH, width: w, height: h, rx: r, fill: COL.cherry }, p);
  return el("rect", { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: r, fill, stroke: o.stroke ?? COL.cherry, "stroke-width": o.sw ?? 5 }, p);
}
function circ(p, cx, cy, r, fill, o = {}) {
  if (o.shadow) el("circle", { cx: cx + SH, cy: cy + SH, r, fill: COL.cherry }, p);
  return el("circle", { cx, cy, r, fill, stroke: o.stroke ?? COL.cherry, "stroke-width": o.sw ?? 5 }, p);
}
function txt(p, x, y, str, o = {}) {
  const t = el("text", {
    x, y, fill: o.fill || COL.cherry, "font-family": o.font === "b" ? "Bricolage" : "Anton", "font-size": o.size || 40,
    "font-weight": o.weight || (o.font === "b" ? 700 : 400), "text-anchor": o.anchor || "start",
    "dominant-baseline": o.base || "auto", "letter-spacing": o.ls || 0,
  }, p);
  t.textContent = str;
  return t;
}
const measure = (() => { let probe; return (str, o) => { if (!probe) { probe = txt($("world"), -9999, -9999, ""); probe.setAttribute("xml:space", "preserve"); probe.style.whiteSpace = "pre"; } probe.setAttribute("font-family", o.font === "b" ? "Bricolage" : "Anton"); probe.setAttribute("font-size", o.size || 40); probe.setAttribute("font-weight", o.weight || (o.font === "b" ? 700 : 400)); probe.setAttribute("letter-spacing", o.ls || 0); probe.textContent = str; return probe.getComputedTextLength(); }; })();
// pill sticker centred on the origin; returns its width
function sticker(p, str, o = {}) {
  const size = o.size || 52, h = o.h || size * 1.55, padX = o.padX || size * 0.62;
  const w = measure(str, o) + padX * 2;
  rr(p, 0, 0, w, h, h / 2, o.bg || COL.milk, { shadow: o.shadow !== false });
  txt(p, 0, 2, str, { ...o, size, anchor: "middle", base: "central", fill: o.fg || COL.cherry });
  return w;
}
// round badge with arched text, like the reference swatches
let arcId = 0;
function badge(p, r, fill, arc, center, o = {}) {
  circ(p, 0, 0, r, fill, { shadow: true });
  const id = "arc" + arcId++, ar = r - (o.arcSize || 30) * 0.95;
  el("path", { id, d: `M ${-ar} 0 A ${ar} ${ar} 0 0 1 ${ar} 0`, fill: "none" }, p);
  const t = el("text", { "font-family": "Anton", "font-size": o.arcSize || 30, fill: o.fg || COL.cherry, "letter-spacing": 1.5, "text-anchor": "middle" }, p);
  const tp = el("textPath", { href: "#" + id, startOffset: "50%" }, t); tp.textContent = arc;
  if (center) txt(p, 0, r * 0.28, center, { size: o.size || r * 0.62, anchor: "middle", fill: o.fg || COL.cherry });
}
// icons: one 24-unit grid, 2-unit round stroke, always drawn at 84px, so every icon has the same weight
const ICONS = {
  book: "M3 6.5C5.5 5.3 8.5 5.5 12 7.5C15.5 5.5 18.5 5.3 21 6.5V18.5C18.5 17.4 15.5 17.5 12 19.5C8.5 17.5 5.5 17.4 3 18.5Z M12 7.5V19.5",
  card: "M5 5.5h14a2.5 2.5 0 0 1 2.5 2.5v8a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 16V8A2.5 2.5 0 0 1 5 5.5Z M2.5 10h19 M6 15h4",
  bell: "M3.5 17.5h17 M5.5 17.5a6.5 6.5 0 0 1 13 0 M12 11V8.5 M10 8.5h4 M2.5 20.5h19",
  sparkle: "M12 3l2.1 6.4L20.5 12l-6.4 2.1L12 21l-2.1-6.9L3.5 12l6.4-2.6Z M19 3.5v3 M17.5 5h3",
  window: "M5 4.5h14A2.5 2.5 0 0 1 21.5 7v10a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 17V7A2.5 2.5 0 0 1 5 4.5Z M2.5 9h19 M5.5 6.8h.1 M8 6.8h.1 M7 13h5 M7 16h8",
  blocks: "M3.5 20.5h5v-5h-5Z M9.5 20.5h5v-10h-5Z M15.5 20.5h5v-16h-5Z",
  cursor: "M5 3.5l12.5 6.8-5.6 1.7-2.6 5.5Z M13 13l5 5 M17 4l1.5-1.5 M20 7.5h2",
  shield: "M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6Z M8.5 12l2.5 2.5 4.5-5",
  hat: "M2.5 17.5h19 M4.5 17.5v-3a7.5 7.5 0 0 1 15 0v3 M10 7.3V11 M14 7.3V11",
  wrench: "M14.7 6.3a4.2 4.2 0 0 0 5.2 5.2l-8.6 8.6a2.3 2.3 0 0 1-3.3-3.3l8.6-8.6a4.2 4.2 0 0 0-1.9-1.9Z",
  smile: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M8 14.5c1 1.5 2.4 2.3 4 2.3s3-.8 4-2.3 M9 9.5v.5 M15 9.5v.5",
};
function icon(p, name, color = COL.cherry, size = 84) {
  const g = el("g", { transform: `scale(${size / 24}) translate(-12 -12)` }, p);
  el("path", { d: ICONS[name], fill: "none", stroke: color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  return g;
}

// ===================================================================== animated items
// Every illustration piece is an item: a <g> whose transform is recomputed from t.
const items = [];
function item(parent, x, y, beat, o = {}) {
  const g = el("g", {}, parent);
  items.push({ g, x, y, beat, kind: o.kind || "pop", rot: o.rot || 0, out: o.out, bob: o.bob || 0, ph: rnd() * 6.28, sound: o.sound, sg: o.sg ?? 1 });
  return g;
}
function updItem(it, t) {
  const dt = t - B(it.beat);
  if (dt < 0 || (it.out != null && t > B(it.out) + 0.4)) { it.g.setAttribute("display", "none"); return; }
  it.g.removeAttribute("display");
  let x = it.x, y = it.y, s = 1, r = it.rot, op = 1;
  if (it.kind === "pop") { const k = Math.max(0, S(dt, P.pop)); s = k; r += (1 - k) * -28; }
  else if (it.kind === "rise") { const k = S(dt, P.rise); y += 340 * (1 - k); r += (1 - k) * 10; op = clamp(k * 3); }
  else if (it.kind === "slap") { const k = S(dt, P.slap); s = 1 + 0.55 * (1 - k); op = clamp(dt / 0.05); }
  else if (it.kind === "drop") { const k = S(dt, P.drop); y -= 560 * (1 - k); }
  else if (it.kind === "fade") { op = clamp(S(dt, P.fade)); }
  if (it.bob) y += it.bob * Math.sin(t * Math.PI * 2 / (2 * BEAT) + it.ph);
  if (it.out != null) s *= 1 - clamp(S(t - B(it.out), P.fast));
  it.g.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(3)}) scale(${Math.max(0, s).toFixed(4)})`);
  it.g.setAttribute("opacity", op.toFixed(3));
}
// a word whose letters pop in one by one
function word(parent, x, y, str, o, beat, stagger = 0.05, kind = "rise") {
  let adv = 0;
  [...str].forEach((ch, i) => {
    const w = measure(ch, o);
    if (ch !== " ") { const g = item(parent, x + adv + w / 2, y, beat + i * stagger, { kind, sound: i === 0 ? (o.sound || "whoosh") : null }); txt(g, 0, 0, ch, { ...o, anchor: "middle" }); }
    adv += measure(str.slice(0, i + 1), o) - adv;
  });
  return adv;
}

// ===================================================================== world layout
const NSTOP = 9, GAP = 2300;
const SX = k => k * GAP;
const SY = [0, -140, 90, -70, 110, -100, 70, -90, 0];
const REST = k => [SX(k) - 620, SY[k] + 480];
const STOP_G = Array.from({ length: NSTOP }, (_, k) => el("g", { transform: `translate(${SX(k)} ${SY[k]})` }, $("stops")));
const BLOB = [COL.orange, null, COL.ice, COL.gum, COL.lime, COL.citrus, COL.rasp, COL.orange, COL.cherry];

// trail: one S-curving path through every rest point
function trailD(upto = NSTOP) {
  const pts = Array.from({ length: NSTOP }, (_, k) => REST(k));
  pts.push([pts[NSTOP - 1][0] + 1700, pts[NSTOP - 1][1] - 60]);
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let k = 0; k < Math.min(upto, pts.length - 1); k++) {
    const [ax, ay] = pts[k], [bx, by] = pts[k + 1], s = k % 2 ? -1 : 1;
    d += ` C ${ax + 780} ${ay + 170 * s} ${bx - 780} ${by - 170 * s} ${bx} ${by}`;
  }
  return d;
}
const TRAIL = trailD();
$("trail").setAttribute("d", TRAIL); $("trailReveal").setAttribute("d", TRAIL);
const tmp = el("path", {}, $("world"));
const SLEN = Array.from({ length: NSTOP + 1 }, (_, k) => { if (!k) return 0; tmp.setAttribute("d", trailD(k)); return tmp.getTotalLength(); });
const TRAIL_LEN = $("trail").getTotalLength();
tmp.remove();
$("trailReveal").setAttribute("stroke-dasharray", `${TRAIL_LEN} ${TRAIL_LEN}`);

// ===================================================================== the dot ("you")
function buildDot(p) {
  const g = el("g", {}, p);
  const shadow = el("ellipse", { cx: 0, cy: 40, rx: 34, ry: 9, fill: COL.cherry, opacity: 0.22 }, g);
  const body = el("g", {}, g);
  el("circle", { cx: 0, cy: 0, r: 40, fill: COL.orange, stroke: COL.cherry, "stroke-width": 6 }, body);
  el("circle", { cx: -23, cy: 12, r: 6.5, fill: COL.gum }, body);
  el("circle", { cx: 23, cy: 12, r: 6.5, fill: COL.gum }, body);
  const eyes = el("g", {}, body);
  for (const ex of [-12, 12]) { el("ellipse", { cx: ex, cy: -5, rx: 9, ry: 11, fill: COL.milk, stroke: COL.cherry, "stroke-width": 3 }, eyes); }
  const pupils = [-12, 12].map(ex => el("circle", { cx: ex, cy: -4, r: 5, fill: COL.cherry }, eyes));
  return { g, shadow, body, eyes, pupils };
}
const dotW = buildDot($("dotW")), dotO = buildDot($("dotO"));
const WALKS = Array.from({ length: NSTOP - 1 }, (_, k) => [B(4 * k + 3), B(4 * k + 4)]);
const BLINKS = [2.4, 7.6, 11.4, 15.7, 19.4, 23.6, 27.4, 31.6, 35.2].map(B);
function dotState(t) {    // arc length, hop height, squash, facing — all from t
  let s = 0, hop = 0, sq = 0, walking = false;
  for (let k = 0; k < WALKS.length; k++) {
    const [a, b] = WALKS[k];
    if (t >= b) s = SLEN[k + 1];
    else if (t >= a) {
      const p = (t - a) / (b - a); walking = true;
      s = SLEN[k] + (SLEN[k + 1] - SLEN[k]) * ease(p);
      const ph = 3 * p, fr = ph % 1;
      hop = 95 * Math.sin(Math.PI * fr) * (p < 1 ? 1 : 0);
      sq = 0.24 * Math.exp(-fr * 10) * (ph >= 1 ? 1 : 0);
      break;
    } else break;
  }
  // landing squash after arriving
  for (const [, b] of WALKS) if (t >= b && t < b + 0.4) sq = Math.max(sq, 0.22 * Math.exp(-(t - b) * 9) * Math.cos((t - b) * 22));
  const blink = BLINKS.some(bt => t >= bt && t < bt + 0.13);
  return { s, hop, sq, walking, blink };
}
function drawDot(d, x, y, st, scale = 1) {
  d.g.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${scale.toFixed(4)})`);
  const sx = 1 + st.sq, sy = 1 - st.sq;
  d.body.setAttribute("transform", `translate(0 ${(-st.hop + 40 * (1 - sy)).toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})`);
  const hs = 1 - st.hop / 220;
  d.shadow.setAttribute("transform", `scale(${hs.toFixed(3)})`);
  d.shadow.setAttribute("opacity", (0.22 * hs).toFixed(3));
  d.eyes.setAttribute("transform", st.blink ? "translate(0 -5) scale(1 0.12) translate(0 5)" : "");
  d.pupils.forEach((pu, i) => pu.setAttribute("cx", (i ? 12 : -12) + (st.walking ? 4 : 1.5)));
}

// ===================================================================== camera
const camX = track(SX(0), Array.from({ length: NSTOP - 1 }, (_, k) => [4 * k + 3, SX(k + 1), P.cam]));
const camY = track(SY[0], Array.from({ length: NSTOP - 1 }, (_, k) => [4 * k + 3, SY[k + 1], P.cam]));
function zoomAt(t) {
  let z = 1;
  for (const [a, b] of WALKS) if (t > a && t < b + 0.5) z -= 0.075 * Math.sin(Math.PI * clamp((t - a) / (b - a + 0.5)));
  return z + 0.06 * clamp(S(t - B(36.2), P.soft));
}

// ===================================================================== background: blobs + parallax confetti
const blobs = BLOB.map((c, k) => {
  if (!c) return null;
  const big = k === 8;
  const wide = k === 6;
  const b = { k, rx: big ? 1300 : wide ? 1180 : 700, ry: big ? 950 : wide ? 720 : 560, cx: SX(k) + (big ? 60 : wide ? -120 : 200), cy: SY[k] - 40, seed: k * 1.7, path: el("path", { fill: c }, $("blobs")), beat: 4 * k - 0.6 };
  return b;
}).filter(Boolean);
function blobD(b, t, s) {
  const n = 56, pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = 1 + 0.07 * Math.sin(3 * a + b.seed + 0.9 * t) + 0.045 * Math.sin(5 * a - 2 * b.seed + 1.3 * t) + 0.03 * Math.sin(2 * a + 0.5 * t);
    pts.push([b.cx + Math.cos(a) * b.rx * r * s, b.cy + Math.sin(a) * b.ry * r * s]);
  }
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C ${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + " Z";
}
const PARA = 0.72;
const confetti = [];
seed = 99;
for (let i = 0; i < 210; i++) {
  const x = (-1400 + rnd() * (SX(NSTOP - 1) + 2800)) * PARA, y = -760 + rnd() * 1520;
  const g = el("g", {}, $("para")), c = BRIGHTS[Math.floor(rnd() * BRIGHTS.length)], type = Math.floor(rnd() * 6), sz = 16 + rnd() * 26;
  if (type === 0) el("circle", { r: sz * 0.5, fill: c }, g);
  else if (type === 1) el("path", { d: starD(sz * 0.7, sz * 0.32, 5), fill: c, stroke: COL.cherry, "stroke-width": 3 }, g);
  else if (type === 2) el("path", { d: `M ${-sz / 2} 0 H ${sz / 2} M 0 ${-sz / 2} V ${sz / 2}`, stroke: c, "stroke-width": 8, "stroke-linecap": "round" }, g);
  else if (type === 3) el("path", { d: `M ${-sz} 0 q ${sz / 2} ${-sz / 1.6} ${sz} 0 t ${sz} 0`, fill: "none", stroke: c, "stroke-width": 7, "stroke-linecap": "round" }, g);
  else if (type === 4) el("circle", { r: sz * 0.45, fill: "none", stroke: c, "stroke-width": 7 }, g);
  else el("path", { d: `M 0 ${-sz * 0.55} L ${sz * 0.5} ${sz * 0.4} L ${-sz * 0.5} ${sz * 0.4} Z`, fill: c, stroke: COL.cherry, "stroke-width": 3, "stroke-linejoin": "round" }, g);
  confetti.push({ g, x, y, rot0: rnd() * 360, spin: (rnd() - 0.5) * 40, ph: rnd() * 6.28 });
}
function starD(R, r, n) {
  let d = "";
  for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r : R; d += (i ? " L " : "M ") + (Math.cos(a) * rr).toFixed(1) + " " + (Math.sin(a) * rr).toFixed(1); }
  return d + " Z";
}

// ===================================================================== the stops
const extra = [];   // per-stop custom animation callbacks
const CUES = [];
const cue = (b, s, g = 1) => CUES.push({ t: B(b), s, g });
function chip(k, str, beat, dark = false) {

const finK = t => clamp(S(t - B(36.6), [9.5, 0.86]), 0, 1.03);
function finale(t, u, dotScreen) {
  const k = finK(t), bump = Math.sin(Math.PI * clamp(k));
  const left = lerp(0, PANEL_X, k), inset = 70 * bump;
  $("world").style.clipPath = k > 0 ? `inset(${inset.toFixed(1)}px 0px ${inset.toFixed(1)}px ${left.toFixed(1)}px round ${(90 * bump).toFixed(1)}px)` : "";
  // photo wipes open from where Ritesh sits
  const w = expoOut((u - 38.05) / 0.8);
  $("photo").style.clipPath = `circle(${(1700 * w).toFixed(1)}px at ${(MAN[0] - PANEL_X).toFixed(1)}px ${MAN[1]}px)`;
  ["cv1", "cv2", "cv3", "cv4"].forEach((id, i) => {
    const a = clamp(S(t - B(36.95 + i * 0.12), [22, 1]));
    $(id).style.opacity = a; $(id).style.transform = `translateY(${(36 * (1 - a)).toFixed(2)}px)`;
  });
  // the dot hops from the path into the photo and becomes him
  const a0 = B(36.7), a1 = B(37.9);
  const showO = t >= a0 && t < B(38.6);
  $("dotO").setAttribute("display", showO ? "" : "none");
  $("dotW").setAttribute("display", t >= a0 ? "none" : "");
  if (showO) {
    const p = clamp((t - a0) / (a1 - a0)), e = ease(p);
    const x = lerp(dotScreen[0], MAN[0], e), y = lerp(dotScreen[1], MAN[1] + 40, e);
    const ph = 3 * p, fr = ph % 1;
    const st = { hop: p < 1 ? 120 * Math.sin(Math.PI * fr) : 0, sq: (ph >= 1 ? 0.24 * Math.exp(-fr * 10) : 0) + (t > a1 ? 0.2 * Math.exp(-(t - a1) * 9) : 0), walking: p < 1, blink: false };
    const vanish = 1 - clamp(S(t - B(38.05), [18, 0.7]));
    drawDot(dotO, x, y, st, Math.max(0, (1.35 + 0.5 * clamp(S(t - B(37.95), P.pop)) * (1 - clamp((t - B(38.05)) * 4))) * vanish));
  }
  const rp = clamp((u - 38.05) / 0.9);
  $("ripple").setAttribute("cx", MAN[0]); $("ripple").setAttribute("cy", MAN[1]);
  $("ripple").setAttribute("r", (30 + 260 * expoOut(rp)).toFixed(1));
  $("ripple").setAttribute("opacity", rp > 0 && rp < 1 ? (1 - rp).toFixed(3) : 0);
}

// ===================================================================== seek
function seek(T) {
  const t = clamp(T, 0, END + HOLD), u = t / BEAT;
  const cx = camX(t), cy = camY(t), z = zoomAt(t);
  $("cam").setAttribute("transform", `translate(960 720) scale(${z.toFixed(5)}) translate(${(-cx).toFixed(2)} ${(-cy).toFixed(2)})`);
  $("para").setAttribute("transform", `translate(960 720) scale(${z.toFixed(5)}) translate(${(-cx * PARA).toFixed(2)} ${(-cy * PARA).toFixed(2)})`);
  for (const c of confetti) {
    const vis = Math.abs(c.x - cx * PARA) < 1300 / z && Math.abs(c.y - cy * PARA) < 1000 / z;
    c.g.setAttribute("display", vis ? "" : "none");
    if (vis) c.g.setAttribute("transform", `translate(${c.x.toFixed(1)} ${(c.y + 10 * Math.sin(t * 2 + c.ph)).toFixed(1)}) rotate(${(c.rot0 + c.spin * t).toFixed(2)})`);
  }
  for (const b of blobs) {
    const vis = Math.abs(b.cx - cx) < 2400;
    b.path.setAttribute("display", vis ? "" : "none");
    if (vis) { const s = Math.max(0, S(t - B(b.beat), [9, 0.6])) * (b.k === 8 ? 1 + 0.9 * clamp(S(t - B(36), P.soft)) : 1); b.path.setAttribute("d", blobD(b, t, s)); }
  }
  for (const it of items) updItem(it, t);
  for (const f of extra) f(t);
  // the dot and its trail
  const st = dotState(t);
  const pt = $("trail").getPointAtLength(st.s);
  const lead = 1600 * clamp(S(t - B(1), [4, 1]));
  $("trailReveal").setAttribute("stroke-dashoffset", (TRAIL_LEN - Math.min(TRAIL_LEN, st.s + lead)).toFixed(1));
  const dScale = 1.35 * clamp(S(t, P.pop), 0, 1.3);
  drawDot(dotW, pt.x, pt.y - 54, st, dScale);
  const dotScreen = [960 + (pt.x - cx) * z, 720 + (pt.y - 54 - cy) * z];
  finale(t, u, dotScreen);
}

// ===================================================================== boot
window.seek = seek; window.END = END; window.HOLD = HOLD; window.BEAT = BEAT; window.CUTS = [];
// load every face up front: text is measured while building, before anything has asked for the fonts
Promise.all(["40px Anton", "700 40px Bricolage", "800 40px Bricolage", "700 40px Bricolage", "600 40px Inter", "700 40px Inter"].map(f => document.fonts.load(f, "A₹")))
  .then(() => document.fonts.ready).then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => {
  seed = 11;
  buildStops();
  // every item that makes a sound gets a cue on its own beat
  for (const it of items) if (it.sound) cue(it.beat, it.sound, it.sg);
  for (const [a] of WALKS) for (let h = 0; h < 3; h++) cue(a / BEAT + h * 1 / 3, "hop", 0.55);
  for (const [a] of WALKS) cue(a / BEAT, "whoosh", 0.35);
  cue(36.7, "hop", 0.6); cue(37.1, "hop", 0.6); cue(37.5, "hop", 0.6); cue(37.95, "pop", 1); cue(38.05, "shimmer", 0.9);
  window.CUES = CUES.sort((a, b) => a.t - b.t);
  return document.fonts.ready;   // building the stops can pull in the ₹ face; wait for it too
}).then(() => {
  const qs = new URLSearchParams(location.search);
  seek(parseFloat(qs.get("t") || "0"));
  window.READY = true;
  if (qs.has("play")) { const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % (END + HOLD)); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
});
</script>
